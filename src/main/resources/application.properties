spring.application.name=stored-procedure-light
server.port=8090

# H2 DataSource in Oracle compatibility mode
spring.datasource.url=jdbc:h2:tcp://localhost:9092/mem:testdb;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql + data.sql on startup
spring.sql.init.mode=always
spring.sql.init.separator=@@

# H2 console (optional, useful for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console