spring.application.name=stored-procedure-light

# H2 DataSource in Oracle compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql + data.sql on startup
spring.sql.init.mode=always
spring.sql.init.separator=@@

# H2 console (optional, useful for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console